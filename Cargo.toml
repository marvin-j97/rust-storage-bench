[package]
name = "rust-storage-bench"
version = "1.0.0"
edition = "2021"

[profile.release]
debug = true

[features]
default = ["jemalloc", "rocksdb", "localfjall", "heed", "sqlite"]
heed = ["dep:heed"]
jemalloc = ["dep:jemallocator"]
localfjall = ["dep:local_fjall"]
mimalloc = ["dep:mimalloc"]
rocksdb = ["dep:rocksdb"]
sqlite = ["dep:rusqlite"]
tcmalloc = ["dep:tcmalloc"]

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = { version = "0.5.4", optional = true }

[dependencies]
chrono = "0.4.38"
clap = { version = "4.4.10", features = ["derive"] }
env_logger = "0.10.1"
fake = { version = "2.9.2", features = ["derive", "uuid"] }
fjall = { version = "2.6.5" }
fs_extra = "1.3.0"
hdrhistogram = "7.5.4"
heed = { version = "0.20.5", optional = true }
local_fjall = { package = "fjall", path = "../fjall", optional = true }
log = { version = "0.4.20", features = ["release_max_level_trace"] }
mimalloc = { version = "0.1.43", default-features = false, features = [
], optional = true }
rand = "0.8.5"
redb = "2.4.0"
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }
scru128 = "3.0.2"
serde = { version = "1.0.193", features = ["derive", "rc"] }
serde_json = "1.0.108"
sled = { version = "0.34.7", features = [] }
sysinfo = { version = "0.30.1", features = ["serde"] }
rmp-serde = "1.3.0"
rocksdb = { version = "0.22.0", optional = true, default-features = false, features = [
    "lz4",
] }
tcmalloc = { version = "0.3.0", features = ["bundled"], optional = true }
uuid = { version = "1.8.0", features = ["serde", "v4"] }
zipf = "7.0.1"
