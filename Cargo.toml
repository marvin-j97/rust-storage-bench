[package]
name = "rust-storage-bench"
version = "1.0.0"
edition = "2021"

[profile.release]
debug = false

[features]
default = ["jemalloc"]
heed = ["dep:heed"]
jemalloc = ["dep:jemallocator"]
fjall_3 = ["dep:fjall_3"]
mimalloc = ["dep:mimalloc"]
rocksdb = ["dep:rocksdb"]
sqlite = ["dep:rusqlite"]
tcmalloc = ["dep:tcmalloc"]
antithesis = ["dep:precept"]
metrics = ["fjall_3/metrics"]

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = { version = "0.5.4", optional = true }

[dependencies]
base64 = "0.22"
canopydb = { version = "0.2.4" }
chrono = "0.4.38"
clap = { version = "4.4.10", features = ["derive"] }
env_logger = "0.10.1"
fake = { version = "2.9.2", features = ["derive", "uuid"] }
fjall_2 = { package = "fjall", version = "2.11.2" }
flate2 = "1.0"
fs_extra = "1.3.0"
sketches-ddsketch = "0.3.0"
heed = { version = "0.20.5", optional = true }
fjall_3 = { version = "3.0.0-pre.0", optional = true }
log = { version = "0.4.20", features = ["release_max_level_trace"] }
mimalloc = { version = "0.1.43", default-features = false, features = [
], optional = true }
rand = "0.8.5"
redb = "3.1.0"
rusqlite = { version = "0.37.0", features = [], optional = true }
scru128 = "3.0.2"
serde = { version = "1.0.193", features = ["derive", "rc"] }
serde_json = "1.0.108"
sled = { version = "0.34.7", features = [] }
sysinfo = { version = "0.30.1", features = ["serde"] }
rmp-serde = "1.3.0"
rocksdb = { package = "rust-rocksdb", version = "0.24.0", optional = true }
tcmalloc = { version = "0.3.0", features = ["bundled"], optional = true }
uuid = { version = "1.8.0", features = ["serde", "v4", "v7"] }
zipf = "7.0.1"
precept = { version = "0.1.0", optional = true, features = ["antithesis"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.31.0"
format-bytes = "0.3.0"
pretty-bytes = "0.2.2"
